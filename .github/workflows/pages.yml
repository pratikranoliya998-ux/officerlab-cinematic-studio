name: Deploy OfficerLab to GitHub Pages
on:
  push:
    branches:
      - main
      - feature/recorder-animation-scheduler
  pull_request:
    branches:
      - feature/recorder-animation-scheduler
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build OfficerLab PWA
        run: npm run build
        env:
          OFFICERLAB_BASE_PATH: /officerlab-cinematic-studio/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
