name: Build OfficerLab Lecture Studio Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "capacitor.config.json"
      - "patch-android-manifest.py"
      - "index.html"
      - ".github/workflows/android-apk.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "capacitor.config.json"
      - "patch-android-manifest.py"
      - "index.html"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web application
        run: npm run build
      - name: Verify web build output
        run: |
          test -s dist/index.html
          test -s dist/gpsc-guidance-recorder.html
      - name: Generate native Android project
        run: npx cap add android
      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android
      - name: Apply Android camera and microphone permissions
        run: python3 patch-android-manifest.py
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK output
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: officerlab-lecture-studio-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
