name: Build OfficerLab Android APK

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "!public/officerlab.apk"
      - "assets/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/configure_android.py"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install Python image tooling
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Configure Android app permissions, label and OfficerLab logo
        run: python3 scripts/configure_android.py

      - name: Sync web bundle into Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Publish APK to the Vercel static site
        run: |
          mkdir -p public
          cp android/app/build/outputs/apk/debug/app-debug.apk public/officerlab.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/officerlab.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish OfficerLab Android APK for Vercel download"
            git push origin HEAD:main
          else
            echo "Vercel APK is already up to date."
          fi

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OfficerLab-Lecture-Studio-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
