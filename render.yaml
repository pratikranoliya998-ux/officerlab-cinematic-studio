services:
  - type: web
    name: officerlab-render-worker
    runtime: docker
    rootDir: render-worker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://officerlab-cinematic-studio.vercel.app,http://localhost:5173
      - key: RENDER_API_TOKEN
        sync: false
      - key: OFFICERLAB_API_ACCESS_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "10"
